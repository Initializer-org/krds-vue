# pnpm 설정 (pnpm 11부터 .npmrc 대신 여기서 관리)
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
patchedDependencies:
  '@storybook/vue3-vite': patches/@storybook__vue3-vite.patch
overrides:
  # jsdom(vitest optional peer) 경유 취약 버전 차단
  undici: ^8.10.2
